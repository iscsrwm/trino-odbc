# CI pipeline for the Trino ODBC driver.
#
# Runs on a Debian image, installing the build/test toolchain. The build+test
# and sanitizer jobs gate the pipeline; format and static-analysis jobs are
# advisory (allow_failure) until the existing codebase is fully clean.

stages:
  - build
  - analyze

default:
  image: debian:bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        cmake pkg-config build-essential
        libcurl4-openssl-dev libjson-c-dev unixodbc-dev

variables:
  DEBIAN_FRONTEND: noninteractive

# Build the library + tests and run the suite.
build-and-test:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
    - cmake --build build -j "$(nproc)"
    - ctest --test-dir build --output-on-failure
  artifacts:
    when: on_failure
    paths:
      - build/Testing/
    expire_in: 1 week

# Build and run the suite under AddressSanitizer + UndefinedBehaviorSanitizer
# with leak detection.
sanitizers:
  stage: build
  script:
    - cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_SANITIZERS=ON
    - cmake --build build-asan -j "$(nproc)"
    - ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-asan --output-on-failure

# Verify formatting against .clang-format (advisory).
format-check:
  stage: analyze
  allow_failure: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq clang-format
  script:
    - find src include test -name '*.c' -o -name '*.h'
        | xargs clang-format --dry-run --Werror

# Static analysis with clang-tidy over the compilation database (advisory).
clang-tidy:
  stage: analyze
  allow_failure: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        cmake pkg-config build-essential
        libcurl4-openssl-dev libjson-c-dev unixodbc-dev clang-tidy
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build -j "$(nproc)" --target trino_odbc
    - find src -name '*.c' | xargs clang-tidy -p build
