# CI pipeline for the Trino ODBC driver.
#
# Runs on a Debian image, installing the build/test toolchain. The build+test
# and sanitizer jobs gate the pipeline; format and static-analysis jobs are
# advisory (allow_failure) until the existing codebase is fully clean.

stages:
  - build
  - analyze

default:
  image: debian:bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        cmake pkg-config build-essential
        libcurl4-openssl-dev libjson-c-dev unixodbc-dev

variables:
  DEBIAN_FRONTEND: noninteractive

# Build the library + tests and run the suite.
build-and-test:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
    - cmake --build build -j "$(nproc)"
    - ctest --test-dir build --output-on-failure
  artifacts:
    when: on_failure
    paths:
      - build/Testing/
    expire_in: 1 week

# Build and run the suite under AddressSanitizer + UndefinedBehaviorSanitizer
# with leak detection.
sanitizers:
  stage: build
  script:
    - cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_SANITIZERS=ON
    - cmake --build build-asan -j "$(nproc)"
    - ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-asan --output-on-failure

# Run the live integration tests against a real Trino server (service container).
# Uses Trino's built-in tpch catalog, which needs no data setup.
live-trino:
  stage: build
  services:
    - name: trinodb/trino:latest
      alias: trino
  variables:
    TRINO_TEST_SERVER: trino
    TRINO_TEST_PORT: "8080"
    TRINO_TEST_USER: test
    TRINO_TEST_CATALOG: tpch
    TRINO_TEST_SCHEMA: tiny
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
    - cmake --build build -j "$(nproc)" --target live_tests
    # Wait for Trino to finish starting (its /v1/info reports starting=false).
    - apt-get install -y -qq curl
    - |
      for i in $(seq 1 60); do
        if curl -sf "http://trino:8080/v1/info" | grep -q '"starting":false'; then
          echo "Trino is ready"; break
        fi
        echo "waiting for Trino ($i)..."; sleep 5
      done
    - ./build/test/live_tests

# Verify formatting against .clang-format (gating: the tree is fully formatted).
format-check:
  stage: analyze
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq clang-format
  script:
    - find src include test -name '*.c' -o -name '*.h'
        | xargs clang-format --dry-run --Werror

# Static analysis with clang-tidy over the compilation database (gating: the
# tree is clean against the configured checks).
clang-tidy:
  stage: analyze
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
        cmake pkg-config build-essential
        libcurl4-openssl-dev libjson-c-dev unixodbc-dev clang-tidy
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build -j "$(nproc)" --target trino_odbc
    - find src -name '*.c' | xargs clang-tidy -p build --warnings-as-errors='*'
